<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 탈출: 밤의 가출 작전</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game-container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid #333;
        }
        h1 {
            font-size: 1.8rem;
            color: #ff5252;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background-color: #2a2a2a;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            color: #aaa;
        }
        .status-bar span {
            color: #ff4081;
            font-weight: bold;
        }
        .story-box {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 120px;
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff5252;
        }
        .choices-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn:hover {
            background-color: #ff5252;
            border-color: #ff5252;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .reset-btn {
            margin-top: 20px;
            width: 100%;
            text-align: center;
            background-color: #444;
        }
        .reset-btn:hover {
            background-color: #666;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🚶‍♂️ 밤의 가출 작전</h1>
    
    <div class="status-bar">
        <div>현재 소지금: <span id="money">0</span>원</div>
        <div>소지품: <span id="inventory">없음</span></div>
    </div>

    <div class="story-box" id="story">
        이야기가 여기에 표시됩니다.
    </div>

    <div class="choices-box" id="choices">
        <!-- 선택지 버튼이 동적으로 생성됩니다 -->
    </div>
</div>

<script>
    // 게임 상태 변수
    let gameState = {
        money: 0,
        inventory: []
    };

    // 게임 데이터 (시나리오 노드)
    const storyData = {
        start: {
            text: "시계는 밤 11시 반을 가리키고 있다. 부모님은 모두 주무시고 계신 것 같다. 나는 오늘밤 집을 나가기로 결심했다. 가방을 메고 방 한가운데 서 있다.",
            choices: [
                { text: "책상 위 지갑에서 돈을 챙긴다.", target: "take_money" },
                { text: "소리 없이 창문으로 나갈 준비를 한다.", target: "window" },
                { text: "조용히 현관문으로 걸어간다.", target: "front_door" }
            ]
        },
        take_money: {
            text: "지갑에서 현금 20,000원을 챙겼다! 이제 어디로 갈까?",
            onEnter: () => {
                gameState.money += 20000;
                if(!gameState.inventory.includes("지갑")) gameState.inventory.push("지갑");
            },
            choices: [
                { text: "창문으로 살금살금 나간다.", target: "window" },
                { text: "현관문으로 향한다.", target: "front_door" }
            ]
        },
        window: {
            text: "창문을 열고 마당으로 뛰어내렸다! 앗, 나무 막대를 밟아 '딱!' 소리가 크게 났다. 집 안에서 불이 켜지는 소리가 들린다!",
            choices: [
                { text: "미친 듯이 대문 밖으로 뛴다!", target: "escape_success" },
                { text: "어두운 풀숲 뒤에 숨는다.", target: "caught" }
            ]
        },
        front_door: {
            text: "현관문 열쇠를 천천히 돌린다. '삐리릭-' 도어락 소리가 밤공기를 가른다! 부모님 방 문이 열리는 소리가 난다.",
            choices: [
                { text: "신발도 제대로 못 신고 밖으로 튀어나간다!", target: "escape_success" },
                { text: "죄송하다고 말하고 방으로 돌아간다.", target: "caught_back" }
            ]
        },
        caught: {
            text: "풀숲에 숨었지만, 후래시를 비추며 나온 부모님에게 붙잡혔다...\n\n[GAME OVER - 가출 실패]",
            choices: [
                { text: "처음부터 다시 시도하기", target: "start", isReset: true }
            ]
        },
        caught_back: {
            text: "결국 마음이 약해져 방으로 돌아왔다. 내일 다시 도전해야겠다.\n\n[GAME OVER - 가출 포기]",
            choices: [
                { text: "처음부터 다시 시도하기", target: "start", isReset: true }
            ]
        },
        escape_success: {
            text: "신발 끈도 못 매고 밤거리에 도착했다! 집에서 멀리 벗어나는 데 성공했다.\n하지만 이제부터 진짜 시작이다. 차가운 바람이 분다. 어디로 갈까?",
            choices: [
                { text: "24시 편의점으로 가서 먹을 것을 산다.", target: "convenience_store" },
                { text: "어두운 공원 벤치에 앉아 쉬어간다.", target: "park" }
            ]
        },
        convenience_store: {
            text: function() {
                if(gameState.money >= 5000) {
                    return "편의점에 들어가 따뜻한 컵라면과 음료수를 사 먹었다. 배가 부르니 살 것 같다. 밤을 새우기 위해 24시 PC방으로 향한다.\n\n[HAPPY ENDING - 첫날밤 무사히 넘기기 성공!]";
                } else {
                    return "편의점에 들어갔지만 주머니에 돈이 하나도 없다... 주인이 수상하게 쳐다본다. 배고픔과 추위에 지쳐 밤거리를 방황한다.\n\n[BAD ENDING - 배고픔과 추위]";
                }
            },
            choices: [
                { text: "다시 플레이하기", target: "start", isReset: true }
            ]
        },
        park: {
            text: "공원 벤치에 앉아 밤하늘을 바라본다. 고요하지만 점점 가슴이 서늘해지고 외로움이 몰려온다. 집의 따뜻한 침대가 그리워지기 시작한다.\n\n[TRUE ENDING - 집의 소중함]",
            choices: [
                { text: "다시 플레이하기", target: "start", isReset: true }
            ]
        }
    };

    // 화면 업데이트 함수
    function updateScene(nodeKey) {
        const node = storyData[nodeKey];
        
        // 함수 형태의 텍스트 처리
        if (typeof node.text === 'function') {
            document.getElementById('story').innerText = node.text();
        } else {
            document.getElementById('story').innerText = node.text;
        }

        // 특정 노드에 진입할 때 상태 변경 로직 실행
        if (node.onEnter) {
            node.onEnter();
        }

        // 상태창 업데이트
        document.getElementById('money').innerText = gameState.money.toLocaleString();
        document.getElementById('inventory').innerText = gameState.inventory.length > 0 ? gameState.inventory.join(', ') : '없음';

        // 선택지 버튼 생성
        const choicesContainer = document.getElementById('choices');
        choicesContainer.innerHTML = '';

        node.choices.forEach(choice => {
            const button = document.createElement('button');
            button.className = 'btn';
            if(choice.isReset) button.classList.add('reset-btn');
            button.innerText = choice.text;
            button.onclick = () => {
                if(choice.isReset) {
                    // 게임 초기화
                    gameState.money = 0;
                    gameState.inventory = [];
                }
                updateScene(choice.target);
            };
            choicesContainer.appendChild(button);
        });
    }

    // 게임 시작
    updateScene('start');
</script>

</body>
</html>
